# tote.toml — t 语言工具链包清单 (package manifest)
#
# 形态依据: docs/syntax/drafts/module.md §12（建议 schema）
# 兼容性: 当前 src/tote.tc 的极简 parser 仅读取 [package] 的 name 与依赖数组。
#         本文件保留依赖数组写法以兼容现有 tote；[build]/[modules]/[interop.c]/[tests]/[examples]
#         为前向字段，待 tote 升级为真正的 TOML 子表解析后生效。外部依赖请登记在下方依赖数组。

[package]
name    = "t"
version = "0.1.0"
entry   = "src/tc.tc"          # 自举编译器入口；tote build -> out/<mode>/tc.exe
deps    = []                   # 外部插件依赖（当前为空；本工程自包含，运行时见 runtime/）

# ── 模块说明 ───────────────────────────────────────────────────
# src/tc.tc    : 单体自举编译器（内联 lexer/parser/checker），含 @main，是上面入口。
# src/tote.tc  : 包管理器 driver（tote.exe），用 `tote build src/tote.tc` 单独构建。
# src/lexer.tc / parser.tc / checker.tc : 独立开发/测试程序（各自含 main），非库模块。
# src/totter.tc: 已放弃（abandoned）的生成器，不再参与构建。

[build]
backend    = "llvm"            # 默认 LLVM 后端（对齐 src/tc.tc 默认行为）
mode       = "rls"             # 发布档；--mode dbg 覆盖 -> out/dbg 与 .tlibd
out_dir    = "out"             # 对齐 gate 双通道: out/dbg | out/rls
libs_dir   = "tlib"            # 本地模块/插件搜索目录（.tlib / .tlibd）
source_dir = "src"             # 本工程库模块源码根

[modules]
# 当前业务代码内联于 src/tc.tc（单体），暂无独立库模块需映射。
# 未来若把组件抽成 export 库模块，在此登记:  "lexer" = "src/lexer.tc"

[interop.c]
enabled       = false          # 编译器本身不导出 C 库；运行时以 runtime/*.c (t_runtime.lib) 提供
# 若未来要把某模块导出为 C 兼容库，置 enabled = true 并填:
#   kind          = "static"   # static(.lib/.a) | dynamic(.dll/.so) | both
#   header        = "t.h"      # 由接口块(§10)驱动的 C 头
#   symbol_prefix = "t"        # 导出符号前缀，避免 DLL 撞名

[tests]
dir     = "tests"             # 一致性/合规测试根目录（含 conformance/ samples/ err_samples/ variant_smoke/）
level   = "check"             # 仅类型检查，不生成代码（对齐 gate conformance 步骤）
pattern = ["*.tc"]            # 通配全部 .tc；p*/f* 为 check 级合规用例
gate    = "tools/gate.mjs"   # 由 gate 的 conformance 步骤执行

[examples]
dir             = "examples"            # 可运行示例目录（.tc + 同名 .expected.txt）
expected_suffix = ".expected.txt"      # 期望输出后缀，run_examples 双后端实跑后比对
gate            = "tools/gate.mjs"     # 由 gate 的 run_examples 步骤执行
