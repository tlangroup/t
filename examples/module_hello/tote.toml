[package]
name    = "module_hello"
version = "0.1.0"
entry   = "src/main.tc"
deps    = []

[build]
backend    = "llvm"
mode       = "rls"
out_dir    = "out"
libs_dir   = "tlib"
source_dir = "src"

[modules]
hello = "src/hello.tc"

[interop.c]
enabled = false

[tests]
dir     = "src"
pattern = ["*.tc"]
gate    = "tools/gate.mjs"

[examples]
dir             = "src"
expected_suffix = ".expected.txt"
gate            = "tools/gate.mjs"
