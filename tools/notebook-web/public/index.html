<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>t Notebook — 测试页</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">t</span>
      <span>notebook</span>
      <span class="sub">Observable 式测试页 · 复用 tools/notebook.mjs 编译后端（tc 零改动）</span>
    </div>
    <div class="actions">
      <button id="runAll" class="primary">▶ 运行全部</button>
      <button id="addCell">＋ 单元格</button>
      <button id="loadDemo">载入示例</button>
      <span id="status" class="status"></span>
    </div>
  </header>

  <div id="errbanner" class="errbanner" hidden></div>

  <main id="cells"></main>

  <template id="cellTpl">
    <section class="cell">
      <div class="cell-head">
        <span class="cid"></span>
        <label>类型
          <select class="kind">
            <option value="decl">decl</option>
            <option value="expr">expr</option>
            <option value="stmt">stmt</option>
          </select>
        </label>
        <label>显示
          <select class="disp">
            <option value="int">int</option>
            <option value="str">str</option>
          </select>
        </label>
        <span class="spacer"></span>
        <button class="runone" title="运行（本格也会带动依赖）">↻</button>
        <button class="del" title="删除">✕</button>
      </div>
      <textarea spellcheck="false" placeholder="在此输入 t 代码…"></textarea>
      <pre class="cell-out"></pre>
    </section>
  </template>

  <script src="/app.js"></script>
</body>
</html>
